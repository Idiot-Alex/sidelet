<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Sidelet 便签精灵</title>
  <desc>没有底盘的奶油色便签精灵，折角像呆毛，侧边带绿黄任务标签，小手扒在卡片边缘。</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- The full silhouette fits inside the existing circular input region. -->
    <!-- Priority tabs emerge from the paper's side. -->
    <path d="M93 40L106 38Q112 38 112 44V51Q112 56 107 56L94 58Z" fill="#83a68b" stroke="#4b6e5d" stroke-width="2.4"/>
    <path d="M96 64L108 63Q113 63 113 68V75Q113 80 108 80L94 82Z" fill="#dfb66b" stroke="#9b8255" stroke-width="2.2"/>
    <!-- Little feet make the memo feel alive, even at rest. -->
    <path d="M43 98L43 109Q41 115 34 112Q29 110 33 105L37 99M77 100L80 109Q82 115 89 111Q94 108 89 104L85 98" fill="#789581" stroke="#426150" stroke-width="2.4"/>
    <!-- The main sheet has a folded top-right corner and a slight lean. -->
    <path d="M31 27Q30 21 38 20L77 16L99 35L102 91Q103 103 91 105L39 110Q27 111 26 99L22 39Q21 28 31 27Z" fill="#fff3d6" stroke="#526959" stroke-width="2.6"/>
    <path d="M29 89L31 99Q31 105 40 104L90 99Q97 98 97 90L99 54L102 91Q103 103 91 105L39 110Q27 111 26 99Z" fill="#e6dcb8"/>
    <path d="M29 38Q28 29 38 28L68 25" fill="none" stroke="#fffdf0" stroke-width="3.2"/>
    <!-- The lifted fold doubles as one recognisable tuft. -->
    <path d="M77 16Q73 28 79 36Q87 40 99 35Z" fill="#bfd2ac" stroke="#526959" stroke-width="2.3"/>
    <path d="M79 19L81 31L92 33" fill="none" stroke="#e5edcf" stroke-width="2.2"/>
    <!-- Expressive anime eyes: broad lashes, sage irises, cream highlights. -->
    <path d="M35 56Q43 48 54 54L55 66Q46 75 37 67ZM68 53Q78 46 87 52L88 64Q79 73 70 65Z" fill="#fffdf4"/>
    <ellipse cx="46" cy="61" rx="7" ry="9.5" fill="#5c8972"/>
    <ellipse cx="79" cy="58" rx="7" ry="9.5" fill="#5c8972"/>
    <path d="M40 63Q46 66 52 62Q52 70 46 70Q41 70 40 63M73 60Q79 63 85 59Q85 67 79 67Q74 67 73 60" fill="#b4ce90"/>
    <ellipse cx="46" cy="60" rx="2.6" ry="4.8" fill="#304e40"/>
    <ellipse cx="79" cy="57" rx="2.6" ry="4.8" fill="#304e40"/>
    <circle cx="43.5" cy="55.5" r="2.7" fill="#fffef1"/>
    <circle cx="76.5" cy="52.5" r="2.7" fill="#fffef1"/>
    <circle cx="49" cy="66" r="1.3" fill="#f5f5c3"/>
    <circle cx="82" cy="63" r="1.3" fill="#f5f5c3"/>
    <path d="M33 53L36 55Q44 48 54 54M68 53Q78 46 87 52L90 48" fill="none" stroke="#3e5a48" stroke-width="2.8"/>
    <path d="M37 44Q44 40 50 43M72 41Q78 37 84 40" fill="none" stroke="#a4ac81" stroke-width="2"/>
    <ellipse cx="35" cy="73" rx="5.5" ry="2.8" fill="#edba9f"/>
    <ellipse cx="91" cy="68" rx="5" ry="2.7" fill="#edba9f"/>
    <path d="M57 76Q62 82 68 74" fill="none" stroke="#986d52" stroke-width="2"/>
    <!-- A tiny real task line grounds the character in Sidelet. -->
    <rect x="44" y="87" width="10" height="10" rx="3" fill="#6e9073"/>
    <path d="M46 92L49 95L53 89" fill="none" stroke="#fff8e5" stroke-width="1.7"/>
    <path d="M61 90L82 88M61 95L74 94" fill="none" stroke="#b5b78c" stroke-width="2.4"/>
    <!-- Hands curl around the paper edges, with generous visible shapes. -->
    <path d="M26 78Q18 74 17 81Q16 90 24 94Q29 96 32 91L33 85Q33 80 29 81Z" fill="#fff3d6" stroke="#526959" stroke-width="2.4"/>
    <path d="M21 83L25 85M22 88L26 89" fill="none" stroke="#d3bc91" stroke-width="1.5"/>
    <path d="M99 74Q106 68 110 74Q114 81 108 87Q103 92 99 88L96 83Q94 79 98 78Z" fill="#fff3d6" stroke="#526959" stroke-width="2.4"/>
    <path d="M106 76L103 80M108 81L105 84" fill="none" stroke="#d3bc91" stroke-width="1.5"/>
  </g>
</svg>
